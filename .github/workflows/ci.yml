name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: requirements.txt matches uv.lock
        run: |
          uv export --no-dev --no-hashes --no-emit-project --no-header -q -o /tmp/requirements.txt
          diff /tmp/requirements.txt ../requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
      - name: Test
        run: npm test

  api-types:
    name: API types in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.10"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --directory backend --locked
      - run: make types
      - run: git diff --exit-code frontend/src/lib/api/schema.d.ts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Smoke test
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS http://localhost:8080/day-ahead/2026-01-12 | grep -q '<div id="root">'
          curl -fsS "http://localhost:8080/api/v1/accuracy" | grep -q '"mae_mw":2019'
      - if: always()
        run: docker compose down
