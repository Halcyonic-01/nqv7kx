[project]
name = "beaufort"
version = "0.1.0"
description = "Day-ahead wind forecast monitoring API (Elexon WINDFOR vs FUELHH)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.12",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]  # en dashes in UI labels

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["beaufort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Silence Starlette's httpx2 nudge.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true
