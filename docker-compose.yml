services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # docker compose run --rm ingest
  ingest:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "beaufort.ingest"]
    environment:
      BEAUFORT_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    profiles: ["tools"]
